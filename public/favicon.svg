<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Carbon Copy: blueprint field, seal octagon in bronze, safety-yellow shutter dot -->
  <rect width="64" height="64" rx="12" fill="#16324f"/>
  <!-- seal octagon -->
  <polygon points="32,10 46,16 52,30 46,44 32,50 18,44 12,30 18,16"
           fill="none" stroke="#b45309" stroke-width="4" stroke-linejoin="round"/>
  <!-- shutter -->
  <circle cx="32" cy="30" r="8" fill="#facc15"/>
  <circle cx="32" cy="30" r="3.5" fill="#16324f"/>
</svg>
